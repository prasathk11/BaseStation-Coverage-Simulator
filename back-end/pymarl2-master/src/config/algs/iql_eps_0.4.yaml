# --- VDN specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 12000 # 50000 for 6h_vs_8z

runner: "episode"
# batch_size_run: 8
buffer_size: 1800
# batch_size: 128
optimizer: 'adam'


# t_max: 75000

# update the target network every {} episodes
target_update_interval: 3000

# use the Q_Learner to train
# mac: "n_mac"
# mac: "basic_mac"
# agent: "n_rnn"
# agent: "rnn"
agent_output_type: q

# learner: "nq_learner"
learner: "q_learner"
mixer: 
# mixing_embed_dim: 32
# hypernet_embed: 64
# lr: 0.001 # Learning rate for agents
# td_lambda: 0.2
optimizer: 'adam'
# q_lambda: False

name: "iql_env=dt_rb_allocation_10u_rb_9_eps_0.4"

# att_vdn
# att_heads: 4
# att_embed_dim: 32

double_q: True