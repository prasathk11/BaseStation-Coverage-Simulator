# --- IQL specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 20000 # 50000

runner: "episode"
batch_size_run: 1
# t_max: 10050000

buffer_size: 1800 # 5000

# update the target network every {} episodes
target_update_interval: 3000 # 200

# use the Q_Learner to train
agent_output_type: "q"
learner: "q_learner"
double_q: False # True
mixer: # Mixer becomes None
optimizer: "adam"

name: "iql_env=dt_rb_allocation"
# algorithm: "iql"

lr: 0.001
