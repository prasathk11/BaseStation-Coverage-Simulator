# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000 #！ 100000

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "vdn"
mixing_embed_dim: 32
hypernet_layers: 8
hypernet_embed: 16

# mixing_embed_dim: 32
# hypernet_layers: 8
# hypernet_embed: 16
optimizer: "adam" # follow the optimizer used in the IQN paper


name: "vdn"

# IQN specific parameters
# n_quantiles: 2 # N in paper
# n_target_quantiles: 2 # N' in paper
# n_approx_quantiles: 2 # \hat{N} in paper, for approximating Q
# agent: "zyj_rnn"

